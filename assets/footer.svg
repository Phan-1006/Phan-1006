  <text x="600" y="62" text-anchor="middle" font-family="'Courier New', 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="19" font-weight="bold" fill="#e4ddc8" letter-spacing="3">QUAND TU ES PERDU DANS LE NOIR,</text>
  <text x="600" y="92" text-anchor="middle" font-family="'Courier New', 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="19" font-weight="bold" fill="#c9a23a" letter-spacing="3">CHERCHE LA LUMIÈRE.</text>
